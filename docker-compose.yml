services:
  ygo-tracker:
    build: .
    image: openyugi
    container_name: openyugi_tracker
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      # Keep config.json inside the persisted data/ directory. The app saves it
      # with an atomic os.replace(); it now lands on the NAS-backed volume below.
      - OPENYUGI_CONFIG_FILE=/app/data/config.json
      # Provide a stable session-signing secret (>=32 chars) so logins survive restarts.
      # Override in an .env file or your shell before `docker compose up`.
      - OPENYUGI_STORAGE_SECRET=${OPENYUGI_STORAGE_SECRET:-please-change-me-to-a-long-random-string-32+}
      # Set to 1/true/yes only when served exclusively over HTTPS.
      - OPENYUGI_SECURE_COOKIES=${OPENYUGI_SECURE_COOKIES:-0}
      # The Pi 5 boots off a space-constrained USB OS drive, so redirect the
      # ML model caches that honor cache-dir env vars (EasyOCR / DocTR / Torch /
      # HuggingFace) onto the NAS-backed volume. Otherwise these weights download
      # into the container's writable layer on the USB drive and re-download on
      # every recreate. (YOLO/Ultralytics weights are baked into the image at
      # build time instead — Ultralytics has no download-dir env var.)
      - EASYOCR_MODULE_PATH=/app/data/models/easyocr
      - DOCTR_CACHE_DIR=/app/data/models/doctr
      - YOLO_CONFIG_DIR=/app/data/models/ultralytics
      - TORCH_HOME=/app/data/models/torch
      - HF_HOME=/app/data/models/huggingface
      - XDG_CACHE_HOME=/app/data/cache
    volumes:
      # OpenYuGi is file-based (no SQL/NoSQL DB). The data/ directory (collections,
      # decks, db cache, images, and config.json) is persisted on the NAS via the
      # CIFS-backed named volume defined below.
      - nas_openyugi:/app/data
    restart: unless-stopped

volumes:
  # NAS-backed storage for the OpenYuGi data directory (CIFS/SMB).
  # Mirrors the homelab convention. Set USERNAME in an .env file next to this
  # compose file (same as the homelab repo):
  #   USERNAME=leo
  # Authentication follows your existing NAS setup. If the share needs a
  # password, add it to the options string (password=...) or use a credentials
  # file; if it allows guest access, the username alone is enough — matching how
  # the homelab volumes are defined.
  nas_openyugi:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${USERNAME},uid=1000,gid=1000,vers=3.0"
      device: "//127.0.0.1/shared/data/openyugi"
